# Freigeben & veröffentlichen (Projektdoku, Abschnitt 9)
#
# Läuft NUR, wenn wir ihn in diesem öffentlichen Repo von Hand starten
# (Actions → „Freigeben & veröffentlichen“ → Run workflow). Er BAUT NICHTS:
#   1. holt den unsignierten Release-Kandidaten eines main-Builds aus dem
#      privaten Repo (Lese-Token, nur Leserecht auf Actions),
#   2. prüft Version, Build-Nr. und Prüfsumme gegen meta.json,
#   3. signiert mit unserem Signierschlüssel (nur hier als Secret),
#   4. legt das Release vX.Y.Z mit APK und version.json an.
# Die normale App findet die neue Version dann über die Update-Prüfung.
#
# Secrets (Settings → Secrets and variables → Actions):
#   LESE_TOKEN               fine-grained Token, nur Weinberg-App/Weinberg-App, Actions: Read-only
#   SIGNING_KEYSTORE_B64     Signierschlüssel (.jks) als Base64
#   SIGNING_STORE_PASSWORD   Passwort des Schlüsselspeichers
#   SIGNING_KEY_ALIAS        Alias des Schlüssels
#   SIGNING_KEY_PASSWORD     Passwort des Schlüssels
#   SIGNING_CERT_SHA256      SHA-256-Fingerabdruck des Zertifikats (Kontrolle, ohne Doppelpunkte, klein)

name: Freigeben & veröffentlichen

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build-Nr. des Release-Kandidaten (Lauf auf main, z. B. 16)'
        required: true
        type: string
      version:
        description: 'Version, z. B. 1.0.0 (muss zum Kandidaten passen)'
        required: true
        type: string
      neu:
        description: 'Was ist neu? (kurz – erscheint in der App)'
        required: true
        type: string

permissions: {}

concurrency:
  group: freigabe
  cancel-in-progress: false

jobs:
  freigabe:
    name: Kandidat prüfen, signieren, veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SRC_REPO: Weinberg-App/Weinberg-App
      BUILD: ${{ inputs.build }}
      VERSION: ${{ inputs.version }}
      NEU: ${{ inputs.neu }}
    steps:
      - name: Eingaben prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Build-Nr. muss eine Zahl sein."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version bitte im Format 1.2.3."; exit 1; }
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Version v$VERSION ist schon veröffentlicht."; exit 1
          fi

      - name: Lauf des Kandidaten finden
        id: lauf
        env:
          GH_TOKEN: ${{ secrets.LESE_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/$SRC_REPO/actions/workflows/build.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number == $BUILD) | .id" | head -1)
          [ -n "$RUN_ID" ] || { echo "::error::Kein erfolgreicher main-Build Nr. $BUILD gefunden."; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Kandidat holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-kandidat
          path: kandidat
          repository: Weinberg-App/Weinberg-App
          run-id: ${{ steps.lauf.outputs.run_id }}
          github-token: ${{ secrets.LESE_TOKEN }}

      - name: Kandidat prüfen (Version, Build-Nr., Prüfsumme)
        run: |
          jq . kandidat/meta.json
          [ "$(jq -r .versionName kandidat/meta.json)" = "$VERSION" ] || { echo "::error::Kandidat hat eine andere Version als $VERSION."; exit 1; }
          [ "$(jq -r .versionCode kandidat/meta.json)" = "$BUILD" ] || { echo "::error::Build-Nr. passt nicht."; exit 1; }
          echo "$(jq -r .apkSha256 kandidat/meta.json)  kandidat/weinberg-unsigned.apk" | sha256sum -c -

      - name: Signieren
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$KS"
          trap 'rm -f "$KS"' EXIT
          "$BT/zipalign" -f -P 16 4 kandidat/weinberg-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          OUT="weinberg-$VERSION.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | tee signatur.txt
          GOT=$(grep -m1 'SHA-256 digest' signatur.txt | awk '{print $NF}')
          if [ -n "$CERT_SHA256" ] && [ "$GOT" != "$CERT_SHA256" ]; then
            echo "::error::Signatur-Fingerabdruck passt nicht zum hinterlegten Zertifikat."; exit 1
          fi
          echo "apk=$OUT" >> "$GITHUB_ENV"

      - name: version.json schreiben
        run: |
          jq -n --arg v "$VERSION" --argjson c "$BUILD" --arg s "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --arg commit "$(jq -r .commit kandidat/meta.json)" \
            '{versionName: $v, versionCode: $c, apkSha256: $s, commit: $commit}' > version.json
          cat version.json

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$NEU" > notes.md
          gh release create "v$VERSION" "$apk" version.json -R "$GITHUB_REPOSITORY" \
            --title "Weinberg-App $VERSION" --notes-file notes.md --latest
